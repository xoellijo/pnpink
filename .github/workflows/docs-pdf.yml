name: docs-pdf

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to push (format vX.Y.Z) after building the PDF"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.pdf.yml"
      - "hooks/**"
      - ".github/workflows/docs-pdf.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libglib2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements-pdf.txt

      - name: Build docs site with PDF
        run: mkdocs build -f mkdocs.pdf.yml --strict

      - name: Collect PDF artifact
        run: |
          mkdir -p .artifacts
          if [ -f site/pnpink.pdf ]; then
            cp site/pnpink.pdf .artifacts/pnpink.pdf
          elif [ -f pnpink.pdf ]; then
            cp pnpink.pdf .artifacts/pnpink.pdf
          else
            PDF_PATH="$(find . -type f -name '*.pdf' | head -n 1 || true)"
            if [ -n "$PDF_PATH" ]; then
              cp "$PDF_PATH" .artifacts/pnpink.pdf
            fi
          fi
          ls -la .artifacts
          test -f .artifacts/pnpink.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnpink-docs-pdf
          path: .artifacts/pnpink.pdf
          if-no-files-found: error

      - name: Push release tag
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          case "$TAG" in
            v*) ;;
            *) echo "release_tag must start with 'v' (example: v0.42.0)"; exit 1 ;;
          esac
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
