name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ -z "${VERSION}" || "${VERSION}" == "${TAG}" ]]; then
            echo "Tag must match v* (example: v0.41). Got: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build payload ZIPs
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          root = Path(".")
          dist = root / "dist"
          src = root / "src"

          inx_files = list((src / "inx").glob("*.inx"))
          if not inx_files:
              raise SystemExit("No src/inx/*.inx files found; aborting release.")

          payload_name = f"pnpink_payload_{version}.zip"
          payload_path = dist / payload_name
          with zipfile.ZipFile(payload_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(src.rglob("*")):
                  if p.is_file():
                      if p.parent == src / "docs" and p.suffix.lower() == ".pdf":
                          continue
                      zf.write(p, p.relative_to(root).as_posix())

          latest_name = "pnpink_payload_latest.zip"
          latest_path = dist / latest_name
          latest_path.write_bytes(payload_path.read_bytes())

          print(f"payload_name={payload_name}")
          print(f"latest_name={latest_name}")
          PY

          LATEST_NAME="pnpink_payload_latest.zip"
          test -f "dist/${LATEST_NAME}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PnPInk ${{ steps.meta.outputs.tag }}
          prerelease: false
          files: |
            dist/pnpink_payload_${{ steps.meta.outputs.version }}.zip
            dist/pnpink_payload_latest.zip
            install.py
            pnpink_install.sh
            pnpink_install.bat
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
