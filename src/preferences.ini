[prefs]

# Auto-generate the deck when the window starts. Values: 0 | 1
auto_create = 0

# Auto-export after generation. Values: 0 | 1
auto_export = 0

# Open the generated SVG after generation. Values: 0 | 1
auto_open = 1

# Console log verbosity. Values: none | error | warn | info | debug | trace | all | debug_only | trace_only
console_log_level = none

# File log verbosity written to pnpink.log. Values: none | error | warn | info | debug | trace | all | debug_only | trace_only
file_log_level = all

# Write logs as JSON. Values: 0 | 1
log_json = 0

# Enable standard PDF export. Values: 0 | 1
export_pdf = 0

# Enable PDF/X CMYK export. Values: 0 | 1
export_pdfx = 0

# PDF/X standard used for CMYK export. Values: 1a | 3 | 4
pdfx_version = 4

# Standard PDF output profiles. Comma-separated values: default, screen, ebook, printer, prepress
pdf_profiles = default

# ICC profile used for PDF/X CMYK export.
# Values: iso_coated_v2_fogra39 | pso_coated_v3_fogra51 | pso_coated_v3_300 | pso_uncoated_v3_fogra52 | iso_uncoated_yellowish_fogra29 | gracol_2006_coated1 | gracol_2013_crpc6 | us_web_coated_swop_v2
# Absolute paths to *.icc or *.icm are accepted as an advanced fallback.
pdf_cmyk_icc = iso_uncoated_yellowish_fogra29

# Force text to pure black in PDF/X CMYK export when supported. Values: 0 | 1
pdf_cmyk_pure_black_text = 1

# Filter rasterization strategy for PDF export.
# Values: png | jpeg | png_alpha | inkscape | none
pdf_raster_mode = none

# Enable additional non-PDF export. Values: 0 | 1
export_png = 1

# Additional output format. Values: png | jpeg | jpeg2000 | pdf | svg | tiff | webp | avif | ps | eps | emf | wmf
export_other_format = png

# Optional pages for additional output. Examples: 1,3-5,8. Empty = all pages
export_other_pages = 

# Optional object IDs for additional output. Comma-separated ids. If set, page selection is ignored and one file per ID is exported.
export_other_ids = 

# Export plotter cut templates from generated instance bboxes. Values: 0 | 1
export_cut_template = 1

# Cut template output format. Values: svg | png | dxf
export_cut_template_format = dxf

# PNG antialias level used by png_alpha raster export. Values: 0 | 1 | 2 | 3
export_png_antialias = 0

# Bitmap matte/background color when applicable. Values: any valid SVG color string
export_png_background = #ffffff

# Bitmap background opacity when applicable. Values: 0.0..1.0 or 1..255
export_png_background_opacity = 0.0

# Global Inkscape export DPI. Raster filters use export_dpi * 1.5. Values: integer >= 1
export_dpi = 150

# JPEG quality used by JPEG exports (including Pillow fallback conversions). Values: integer 70..95
export_jpeg_quality = 95

# Generate an image DPI preflight report after SVG generation. Values: 0 | 1
# When enabled, writes *_output.image-preflight.txt and does not print the report in the GUI log.
image_preflight = 0

# Parallel Inkscape shell workers used during export. Values: integer >= 1
inkscape_shell_workers = 4

# Parallel network workers for non-Wikimedia web asset downloads. Values: integer 1..32
network_workers = 8

# Parallel network workers for Wikimedia Commons (wkmc://) resolution/downloads. Values: 0 or empty = network_workers; otherwise integer 1..32.
network_workers_wkmc = 4

# Parallel network workers for Google Drive (gdrive://) downloads. Values: integer 1..32.
network_workers_gdrive = 8

# Google Drive API key for public gdrive://file and gdrive://folder sources. Empty disables folder listing.
gdrive_api_key = AIzaSyDmxZ4AbAbHFLwEJH4eYSiVWtvPmXAorEc

# Default maximum vector-tile zoom for osm:// maps. Values: integer 0..22
map_osm_max_zoom = 14

# Default maximum vector-tile zoom for ofm:// maps. Values: integer 0..22
map_ofm_max_zoom = 14

# Default maximum tile grid per axis for automatic osm:// zoom selection. Values: integer >= 1
map_osm_max_tile_grid = 4

# Default maximum tile grid per axis for automatic ofm:// zoom selection. Values: integer >= 1
map_ofm_max_tile_grid = 4

# Show inline-icon hole debug rectangles. Values: 0 | 1
inline_icons_show_debug_rects = 0

# Extra inline icon text advance as a fraction of text height. Negative values bring surrounding text closer without resizing the icon. Default: 0.00
inline_icons_extra_ratio = -0.20

# Template instantiation engine. Values: legacy | composed | composed-instance
# composed is the default; unsupported individual templates fall back to legacy.
template_engine = composed-instance

# User-Agent used for Wikimedia/direct web asset downloads. Empty = github.com/xoellijo/pnpink
web_user_agent = PnPInk/0.57 @github (xoel.lijo@gmail.com)

# Split DM_output into SVG parts. Values: 0 | 1
split_svg_output = 0

# SVG split mode. Values: parts | limits
split_svg_mode = limits

# Split SVG into this number of parts when split_svg_mode=parts. Empty = disabled.
split_svg_parts = 

# Maximum pages per SVG part when split_svg_mode=limits. Empty = no page limit.
split_svg_limit_pages = 10

# Maximum records/cards per SVG part when split_svg_mode=limits. Empty = no record limit.
split_svg_limit_records = 

# Maximum megabytes per SVG part when split_svg_mode=limits. Empty = no MB limit.
split_svg_chunk_mb = 64

# Default cut/registration mark stroke color. Values: any valid SVG color string
marks_stroke = #000000

# Default cut/registration mark stroke width. Values: any SVG/CSS length
marks_stroke_width = 0.1mm

# Default cut/registration mark opacity. Values: 0.0..1.0
marks_opacity = 1.0

# Default cut/registration mark line cap. Values: butt | round | square
marks_linecap = butt

# Default cut/registration mark line join. Values: miter | round | bevel
marks_linejoin = miter

# Default cut/registration mark dash pattern. Values: empty or any SVG stroke-dasharray value
marks_dasharray = 

# Custom/unknown preference.
pdf_raster_filters = 1

# Custom/unknown preference.
pdf_settings = screen

# Custom/unknown preference.
raster_filter_pipeline = png
