<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Deckmaker</title>
  <link rel="manifest" href="manifest.webmanifest?v=078b1">
  <link rel="icon" href="/shared-assets/deckmaker_icon.png?v=078b1" sizes="256x256" type="image/png">
  <link rel="shortcut icon" href="/shared-assets/deckmaker_icon.png?v=078b1" sizes="256x256" type="image/png">
  <link rel="apple-touch-icon" href="/shared-assets/deckmaker_icon.png?v=078b1" sizes="256x256">
  <link rel="stylesheet" href="vendor/lil-gui.min.css">
  <link rel="stylesheet" href="vendor/tabulator_site.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dataset-dock-bottom">
    <aside id="gui" class="deckmaker-gui-host"></aside>
    <section id="preview-panel" class="preview-panel">
      <aside id="spritesheet-gui" class="deckmaker-gui-host spritesheet-gui-host" hidden></aside>
      <div id="preview-viewport" class="preview-viewport" tabindex="0" aria-label="SVG preview">
        <div id="preview-stage" class="preview-stage">
          <img id="preview-image" alt="Generated SVG preview" hidden draggable="false">
          <svg id="sprite-grid-overlay" class="preview-spritesheet-overlay" hidden></svg>
        </div>
        <div id="preview-message" class="preview-message">Preparing preview...</div>
        <div id="preview-scale" class="preview-scale" aria-hidden="true" hidden><i></i><span>10 mm</span></div>
      </div>
    </section>
    <div id="workspace-splitter" class="workspace-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize preview and dataset" tabindex="0"></div>
    <section id="console-panel" class="console-panel" hidden>
      <header class="console-header">
        <span>Log</span>
        <small>Live Deckmaker activity</small>
        <button id="log-close" type="button" title="Close live log" aria-label="Close live log">&times;</button>
      </header>
      <pre id="log" aria-live="polite"></pre>
    </section>
    <section id="gsheet-editor" class="gsheet-editor" hidden>
      <div id="gsheet-editor-message" class="gsheet-editor-message">Resolving sheet tab&hellip;</div>
      <iframe id="gsheet-editor-frame" title="Google Sheets Editor" hidden></iframe>
      <div id="dataset-table" class="dataset-table" aria-label="Local CSV dataset" hidden></div>
    </section>
    <nav id="pdf-page-controls" class="pdf-page-controls" aria-label="PDF pages" hidden>
      <button id="pdf-page-previous" type="button" title="Previous PDF page" aria-label="Previous PDF page">&#x2039;</button>
      <select id="pdf-page-select" title="Select PDF page" aria-label="Select PDF page"></select>
      <button id="pdf-page-next" type="button" title="Next PDF page" aria-label="Next PDF page">&#x203a;</button>
    </nav>
  </main>
  <section id="job-status" class="job-status" aria-live="polite">
    <span id="job-spinner" class="job-spinner" aria-hidden="true"></span>
    <div class="job-copy">
      <strong id="job-title">Ready</strong>
      <span id="job-activity"></span>
      <a id="google-auth-link" href="#" target="_blank" rel="noopener" hidden>Authorize Google Sheets</a>
    </div>
    <progress id="job-progress" max="100" value="0"></progress>
  </section>
  <section id="resource-viewer" class="resource-viewer" role="dialog" aria-modal="true" aria-labelledby="resource-viewer-title" hidden>
    <div class="resource-viewer-window">
      <header class="resource-viewer-header">
        <strong id="resource-viewer-title">PnPInk Help</strong>
        <a id="resource-viewer-external" href="#" target="_blank" rel="noopener noreferrer" title="Open in browser" aria-label="Open in browser"></a>
        <button id="resource-viewer-close" type="button" title="Close" aria-label="Close">&times;</button>
      </header>
      <iframe id="resource-viewer-frame" title="PnPInk Help" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </section>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
