site_name: PnPInk Documentation
site_description: PnPInk user documentation

theme:
  name: material
  logo: assets/images/pnpink_logo.png
  favicon: assets/images/pnpink_logo.png
  features:
    - navigation.top
    - navigation.path
    - toc.follow

nav:
  - Home: index.md
  - Introduction: intro.md
  - Basic Workflow: quickstart.md
  - DeckMaker GUI: deckmaker-gui.md
  - Dataset:
      - Format and Sources: dataset-overview.md
      - Dataset Reference: dataset.md
  - Text: text.md
  - Package Formats (`.zvg` / `.pnp`): dsl/packages.md
  - DSL:
      - DSL Nomenclature: dsl/nomenclature.md
      - Architecture: dsl/architecture.md
      - Iterators and Copies: dsl/iterators.md
      - Fit and Anchor: dsl/fit-anchor.md
      - Transform: dsl/transform.md
      - Layout: dsl/layout.md
      - Hexes: dsl/hexes.md
      - Paths: dsl/paths.md
      - Page: dsl/page.md
      - Source: dsl/source.md
      - Maps: dsl/maps.md
      - Marks: dsl/marks.md
      - Gradients (Experimental): dsl/gradients.md
      - Advanced: dsl/advanced.md
  - Export: export.md
  - Extensions and Tools: extensions.md
  - Snippets: snippets.md
  - Presets: presets.md

plugins:
  - search

hooks:
  - hooks/numbered_headings.py

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css
