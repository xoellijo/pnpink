<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171924">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PnPPlay">
  <title>PnPPlay - Game Lobby</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="PnPPlay lobby"><span class="brand-mark">P</span><span>PnP<b>Play</b></span></a>
    <span class="topbar-note">Local playtesting workspace</span>
    <div class="identity-switcher" title="Users in this device">
      <button id="install-app" class="icon-button" type="button" title="Install PnPPlay" aria-label="Install PnPPlay" hidden><span data-icon="download"></span></button>
      <button id="share-user" class="icon-button" type="button" title="Use this player on another device" aria-label="Use this player on another device"><span data-icon="devices"></span></button>
      <button id="new-user" class="icon-button" type="button" title="Create a new player on this device" aria-label="Create player"><span data-icon="user-plus"></span></button>
      <select id="active-user" title="Users in this device" aria-label="Users in this device"><option value="">Choose player</option></select>
    </div>
  </header>
  <main class="lobby">
    <section class="create-panel">
      <div class="eyebrow">New session</div>
      <h1>Bring a prototype to the table.</h1>
      <p>Create a persistent room, invite players, and continue on any device.</p>
      <form id="create-form">
        <label class="game-picker-label">Choose a game<select id="game" required hidden></select></label>
        <div id="game-grid" class="game-grid"></div>
        <label class="switch-row">
          <span><strong>Admin mode</strong><small>Perspective and history controls for the creator</small></span>
          <input id="admin-mode" type="checkbox" checked role="switch">
        </label>
        <button class="primary-action">Create room <span data-icon="plus"></span></button>
      </form>
    </section>
    <section class="rooms-panel">
      <div class="rooms-heading">
        <div><div class="eyebrow">Persistent rooms</div><h2>Your playtests</h2></div>
        <button id="refresh" class="icon-button" title="Refresh rooms" aria-label="Refresh rooms"><span data-icon="refresh-cw"></span></button>
      </div>
      <div class="room-tools">
        <label class="search-box"><span data-icon="search"></span><input id="room-search" type="search" placeholder="Search games or room codes"></label>
        <label class="select-all"><input id="select-all" type="checkbox"> Select all mine</label>
        <button id="delete-selected" class="danger-button compact-action" disabled title="Delete selected rooms" aria-label="Delete selected rooms"><span data-icon="trash"></span><span id="selected-count">0</span></button>
      </div>
      <div id="rooms" class="rooms" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="user-dialog" class="user-dialog">
    <form id="user-form">
      <div class="eyebrow">New identity</div>
      <h2>Create a player</h2>
      <p>This player stays available in this browser.</p>
      <label>Player name<input id="new-user-name" maxlength="40" autocomplete="nickname" required></label>
      <div class="dialog-actions"><button id="cancel-user" type="button" class="secondary">Cancel</button><button>Create player</button></div>
      <p id="user-error" class="error"></p>
    </form>
  </dialog>
  <script src="/static/common.js"></script>
  <script src="/static/lobby.js"></script>
</body>
</html>
