<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171924">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PnPPlay">
  <title>PnPPlay - Join Game</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark">P</span><span>PnP<b>Play</b></span></a></header>
  <main class="centered">
    <section class="join-panel">
      <a href="/" class="back-link"><span data-icon="arrow-left"></span> Back to lobby</a>
      <div class="eyebrow" id="room-code"></div>
      <h1 id="game-title">Join game</h1>
      <p>Who is joining from this tab?</p>
      <div id="known-users" class="known-users"></div>
      <button id="show-new-user" class="secondary"><span data-icon="user-plus"></span> New player</button>
      <form id="new-user-form" class="new-user-form" hidden>
        <label>Player name<input id="name" maxlength="40" autocomplete="nickname" required></label>
        <button class="primary-action"><span>Create and continue</span><span data-icon="arrow-right"></span></button>
      </form>
      <div id="entry-actions" class="entry-actions" hidden>
        <p>Continue as <strong id="selected-user"></strong></p>
        <button id="join-button" class="primary-action"><span>Join as player</span><span data-icon="user-plus"></span></button>
        <button id="spectate-button" type="button" class="secondary"><span data-icon="eye"></span> Watch as spectator</button>
      </div>
      <p id="error" class="error"></p>
    </section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/join.js"></script>
</body>
</html>
