# PnPPlay declarative game reference.
# Objects inherited with `extends` are merged deeply. Scalars and arrays replace
# inherited values; they are not appended. Later parents override earlier ones.

# Manifest format version. Currently it must be 1.
schema: 1

# A whole-game template may provide players, turns, board, areas and setup.
# Areas and toolboxes with the same ID merge deeply with the inherited item.
# extends: trick-game

# Saved rooms use immutable game revisions. These values are inherited from
# standard.yaml and only need to be present when this game overrides them.
updates:
  mode: versioned       # versioned | latest-only (deletes incompatible old rooms)
  assets: live          # live | new-games | pinned
  components: new-games
  rules: pinned

# Human-readable game information shown in the lobby and setup screen.
name: Example Card Table
description: A commented reference for the PnPPlay YAML format.

# Use `count` for a fixed player count, or `min` and `max` for a range.
# `panelMode` controls rival panels: rotate follows seating; standard stays upright.
players:
  min: 2
  max: 6
  panelMode: rotate

# `free` allows simultaneous tabletop actions. `guided` follows normal turns.
# `trick-assisted` adds trick completion and winner selection.
turns:
  mode: trick-assisted
  order: clockwise             # right, left, clockwise, or counterclockwise
  maxCardsPerPlay: 1           # 0 means no limit; selected cards move together
  winnerDecider: last          # all, last, next-to-last, or host

# Board proportions and felt color.
board:
  aspectRatio: 1.85
  background: "#173f35"

# PnPPlay already provides deck, discard, table, hand, tricks, tableau,
# shared-supply, player-supply, card, token, square-token, chip, and die.
# Local types can add new defaults or override those standard definitions.
types:
  areas:
    # A small behavior mixin. It can be combined with other area types.
    movable:
      visibility: public
      actions: [move-from, move-to]
      insert: top               # New items enter at the top of a pile

    # Types may inherit another type.
    shared-stack:
      extends: movable
      kind: stack
      scope: shared
      # The white tab drags the complete stack. Both options default to true.
      stackTab: {showCount: true, autoHide: true}
      layout: {rows: 1, columns: 1}

    deck:
      extends: shared-stack
      kind: deck
      visibility: hidden
      actions: [draw, move-from, shuffle]

    discard:
      extends: shared-stack
      kind: discard
      actions: [move-from, move-to, discard-to]

    player-zone:
      extends: movable
      scope: player
      layout: {rows: 1, columns: 1}

    hand:
      extends: player-zone
      kind: hand
      visibility: owner
      layout: {rows: 1, columns: 12}

    tricks: {extends: player-zone, kind: tricks}
    tableau: {extends: player-zone, kind: tableau}

    shared-supply:
      extends: movable
      kind: supply
      scope: shared
      infinite: true            # Returned pieces replenish this supply
      layout: {rows: 1, columns: 1}

  pieces:
    card: {type: card, copies: 1}
    token: {type: token, shape: circle, copies: 10}
    square-token: {extends: token, shape: square}
    chip: {type: chip, copies: 20}
    die: {type: d6}

# Optional vertical containers outside the felt.
toolboxes:
  - id: common-tools
    label: Tools
    scope: shared               # One toolbox shared by everybody
    side: left
  - id: player-tools
    label: My tools
    scope: player               # One private instance per player
    side: right

# Concrete areas inherit defaults and only declare what makes them unique.
areas:
  - id: deck
    extends: deck
    label: Deck
    layout:
      # Coordinates are percentages of the parent area.
      shared: {left: 4, top: 68, width: 8, height: 20}

  - id: discard
    extends: discard
    label: Discard
    # This nested override keeps inherited rows and columns.
    layout:
      shared: {left: 88, top: 68, width: 8, height: 20}

  - id: table
    extends: movable
    label: Table
    kind: center
    scope: shared
    maxDrop: 1                  # Maximum items accepted by one drop
    layout:
      shared: {left: 18, top: 20, width: 64, height: 58}
      rows: 2
      columns: 6
      gap: 1

  - id: hand
    extends: hand
    label: Hand
    layout:
      owner: {left: 21, top: 9, width: 70, height: 88}
      opponent: {left: 3, top: 58, width: 73, height: 39}

  - id: won-tricks
    extends: tricks
    label: Tricks
    layout:
      owner: {left: 92, top: 23, width: 7, height: 74}
      opponent: {left: 78, top: 58, width: 19, height: 39}

  - id: tableau
    extends: tableau
    label: Tableau
    canHide: toggle             # toggle, sync, or select
    layout:
      owner: {left: 1, top: 9, width: 19, height: 88}
      opponent: {left: 3, top: 3, width: 73, height: 52}

  - id: token-bowl
    extends: shared-supply
    label: Tokens
    toolbox: common-tools

# Pieces can also inherit types. Instance values override their type.
pieces:
  - id: red-token
    extends: token
    label: Red token
    color: "#d94b4b"
    initial: {area: token-bowl}

  - id: sample-card
    extends: card
    label: Sample card
    copies: 18
    front: assets/card-front.webp
    back: assets/card-back.webp
    initial:
      area: deck
      faceUp: false

  - id: player-reference
    extends: card
    label: Player reference
    front: assets/reference.webp
    initial:
      area: tableau
      forEachPlayer: true       # Creates one copy for every player
      faceUp: true

# Instead of listing cards above, PnPInk exports may provide an items file:
# pieces:
#   source: assets/items.json
#   extends: card               # Defaults applied to every imported item
#   initial: {area: deck}
#   overrides:                  # Properties matched against component IDs, in order
#     points:
#       "*": 0                 # Every card starts at zero
#       "*H": 1                # Hearts replace that value with one
#       QS: 13                  # Queen of Spades is the most specific override
#   extra:                      # Optional pieces not present in items.json
#     - {id: die, extends: die, label: Die, initial: {area: token-bowl}}

# Setup operations run in order when the game starts.
setup:
  - shuffle: deck
  - deal:
      from: deck
      to: hand
      count: 5
