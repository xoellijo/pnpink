schema: 1
name: Poker Table
description: A standard 52-card deck on a lightweight four-player table.

players:
  count: 4

turns:
  mode: trick-assisted
  order: clockwise

board:
  aspectRatio: 1.6
  background: "#173f35"

areas:
  - id: deck
    label: Deck
    kind: stack
    scope: shared
    visibility: hidden
    actions: [draw, shuffle, move-from]
    layout:
      shared: {left: 8, top: 37, width: 10, height: 26}
      rows: 1
      columns: 1

  - id: table
    label: Table
    kind: center
    scope: shared
    visibility: public
    actions: [move-from, move-to]
    maxDrop: 1
    layout:
      shared: {left: 24, top: 25, width: 52, height: 50}
      rows: 2
      columns: 5

  - id: discard
    label: Discard
    kind: stack
    scope: shared
    visibility: public
    actions: [move-from, move-to, discard-to]
    layout:
      shared: {left: 82, top: 37, width: 10, height: 26}
      rows: 1
      columns: 1

  - id: hand
    label: Hand
    kind: hand
    scope: player
    visibility: owner
    actions: [move-from, move-to]
    layout:
      owner: {left: 12, top: 76, width: 76, height: 22}
      opponent: {left: 34, top: 2, width: 32, height: 14}
      rows: 1
      columns: 13

  - id: tricks
    label: Tricks
    kind: stack
    scope: player
    visibility: public
    actions: [move-from, move-to]
    layout:
      owner: {left: 90, top: 76, width: 8, height: 20}
      opponent: {left: 72, top: 3, width: 8, height: 15}
      rows: 1
      columns: 1

  - id: player-area
    label: Player area
    kind: free
    scope: player
    visibility: public
    actions: [move-from, move-to]
    layout:
      owner: {left: 2, top: 72, width: 8, height: 25}
      opponent: {left: 80, top: 3, width: 8, height: 22}
      rows: 1
      columns: 1

pieces:
  source: assets/items.json
  initial: {area: deck}

setup:
  - shuffle: deck
  - deal: {from: deck, to: hand, count: 13}
