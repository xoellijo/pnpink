schema: 1
name: Poker Table
description: A standard 52-card deck on a lightweight four-player table.

players:
  count: 4

turns:
  mode: trick-assisted
  order: right
  maxCardsPerPlay: 1
  winnerDecider: last

board:
  aspectRatio: 1.7
  background: "#173f35"

toolboxes:
  - {id: general-tools, label: General tools, scope: shared, side: left}
  - {id: player-tools, label: My tools, scope: player, side: right}

areas:
  - id: shared-tokens
    label: Tokens
    kind: supply
    scope: shared
    visibility: public
    toolbox: general-tools
    infinite: true
    actions: [move-from, move-to]
    layout: {rows: 1, columns: 1}

  - id: shared-markers
    label: Markers
    kind: supply
    scope: shared
    visibility: public
    toolbox: general-tools
    infinite: true
    actions: [move-from, move-to]
    layout: {rows: 1, columns: 1}

  - id: player-chips
    label: Poker chips
    kind: supply
    scope: player
    visibility: public
    toolbox: player-tools
    infinite: true
    actions: [move-from, move-to]
    layout: {rows: 1, columns: 1}

  - id: player-dice
    label: Dice
    kind: supply
    scope: player
    visibility: public
    toolbox: player-tools
    actions: [move-from, move-to]
    layout: {rows: 1, columns: 1}

  - id: deck
    label: Deck
    kind: stack
    scope: shared
    visibility: hidden
    actions: [draw, move-from]
    layout:
      shared: {left: 8, top: 37, width: 10, height: 26}
      rows: 1
      columns: 1

  - id: table
    label: Table
    kind: center
    scope: shared
    visibility: public
    actions: [move-from, move-to]
    maxDrop: 1
    layout:
      shared: {left: 24, top: 25, width: 52, height: 50}
      rows: 2
      columns: 5

  - id: discard
    label: Discard
    kind: stack
    scope: shared
    visibility: public
    actions: [move-from, move-to, discard-to]
    layout:
      shared: {left: 82, top: 37, width: 10, height: 26}
      rows: 1
      columns: 1

  - id: hand
    label: Hand
    kind: hand
    scope: player
    visibility: owner
    actions: [move-from, move-to]
    layout:
      owner: {left: 12, top: 76, width: 76, height: 22}
      opponent: {left: 34, top: 2, width: 32, height: 14}
      rows: 1
      columns: 13

  - id: tricks
    label: Tricks
    kind: stack
    scope: player
    visibility: public
    actions: [move-from, move-to]
    layout:
      owner: {left: 90, top: 76, width: 8, height: 20}
      opponent: {left: 72, top: 3, width: 8, height: 15}
      rows: 1
      columns: 1

  - id: player-area
    label: Tableau
    kind: free
    scope: player
    visibility: public
    canHide: toggle
    actions: [move-from, move-to]
    layout:
      owner: {left: 2, top: 72, width: 8, height: 25}
      opponent: {left: 80, top: 3, width: 8, height: 22}
      rows: 1
      columns: 1

pieces:
  source: assets/items.json
  initial: {area: deck}
  extra:
    - {id: red-token, label: Red token, type: token, color: '#d94b4b', copies: 6, initial: {area: shared-tokens}}
    - {id: blue-marker, label: Blue marker, type: token, color: '#4287d9', copies: 6, initial: {area: shared-markers}}
    - {id: poker-chip, label: Poker chip, type: chip, color: '#e7c65b', value: 5, copies: 6, initial: {area: player-chips, forEachPlayer: true}}
    - {id: player-die, label: Player die, type: d6, color: '#f4f0dd', initial: {area: player-dice, forEachPlayer: true}}

setup:
  - shuffle: deck
  - deal: {from: deck, to: hand, count: 13}
