schema: 1

updates:
  mode: versioned
  assets: live
  components: new-games
  rules: pinned

templates:
  trick-game:
    players: {min: 2, max: 8, panelMode: rotate}
    turns: {mode: trick-assisted, order: right, maxCardsPerPlay: 1, winnerDecider: last}
    board: {aspectRatio: 1.85, background: "#173f35"}
    areas:
      - {id: deck, extends: deck, label: Deck, layout: {shared: {left: 25, top: 58, width: 7, height: 15}}}
      - {id: table, extends: table, label: Table, layout: {shared: {left: 24, top: 27, width: 52, height: 50}}}
      - {id: discard, extends: discard, label: Discard, layout: {shared: {left: 68, top: 58, width: 7, height: 15}}}
      - {id: hand, extends: hand, label: Hand, layout: {owner: {left: 21, top: 9, width: 70, height: 88}, opponent: {left: 3, top: 56, width: 72, height: 41}}}
      - {id: tricks, extends: tricks, label: Tricks, layout: {owner: {left: 92, top: 23, width: 7, height: 74}, opponent: {left: 77, top: 56, width: 20, height: 41}}}
      - {id: player-area, extends: tableau, label: Tableau, layout: {owner: {left: 1, top: 9, width: 19, height: 88}, opponent: {left: 3, top: 3, width: 72, height: 50}}}
    setup:
      - shuffle: deck

types:
  areas:
    movable:
      visibility: public
      actions: [move-from, move-to]
      insert: top
    shared-supply:
      extends: movable
      kind: supply
      scope: shared
      infinite: true
      layout: {rows: 1, columns: 1}
    player-supply:
      extends: shared-supply
      scope: player
    shared-stack:
      extends: movable
      kind: stack
      scope: shared
      stackTab: {showCount: true, autoHide: true}
      layout: {rows: 1, columns: 1}
    deck:
      extends: shared-stack
      kind: deck
      visibility: hidden
      actions: [draw, move-from, shuffle]
    discard:
      extends: shared-stack
      kind: discard
      actions: [move-from, move-to, discard-to]
    table:
      extends: movable
      kind: center
      scope: shared
      maxDrop: 1
      layout: {rows: 2, columns: 5}
    player-zone:
      extends: movable
      scope: player
      layout: {rows: 1, columns: 1}
    hand:
      extends: player-zone
      kind: hand
      visibility: owner
      layout: {rows: 1, columns: 13}
    tricks:
      extends: player-zone
      kind: tricks
    tableau:
      extends: player-zone
      kind: tableau
      canHide: toggle

  pieces:
    token:
      type: token
      shape: circle
      copies: 6
    square-token:
      extends: token
      shape: square
    chip:
      type: chip
      copies: 6
    die:
      type: die
    tile:
      type: tile
      copies: 1
    pawn:
      type: pawn
      copies: 1
    meeple:
      type: meeple
      copies: 1
    cube:
      type: cube
      copies: 1
    marker:
      type: marker
      copies: 1
    board:
      type: board
      copies: 1
    mat:
      type: mat
      copies: 1
    area:
      type: area
      copies: 1
    card:
      type: card
      copies: 1
