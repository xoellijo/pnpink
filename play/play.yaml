schema: 1
name: PnPInk Trick Table
description: A lightweight four-player trick-taking prototype.

players: {count: 4, panelMode: rotate}
turns: {mode: trick-assisted, order: clockwise}
board: {aspectRatio: 1.7, background: "#173f35"}

types:
  areas:
    movable:
      visibility: public
      actions: [move-from, move-to]
      insert: top
    shared-supply:
      extends: movable
      kind: supply
      scope: shared
      infinite: true
      layout: {rows: 1, columns: 1}
    player-supply: {extends: shared-supply, scope: player}
    shared-stack:
      extends: movable
      kind: stack
      scope: shared
      layout: {rows: 1, columns: 1}
    deck: {extends: shared-stack, kind: deck, visibility: hidden, actions: [draw, move-from, shuffle]}
    discard: {extends: shared-stack, kind: discard, actions: [move-from, move-to, discard-to]}
    table: {extends: movable, kind: center, scope: shared, maxDrop: 1, layout: {rows: 2, columns: 5}}
    player-zone: {extends: movable, scope: player, layout: {rows: 1, columns: 1}}
    hand: {extends: player-zone, kind: hand, visibility: owner, layout: {rows: 1, columns: 13}}
    tricks: {extends: player-zone, kind: tricks}
    tableau: {extends: player-zone, kind: tableau, canHide: toggle}
  pieces:
    token: {type: token, shape: circle, copies: 6}
    square-token: {extends: token, shape: square}
    chip: {type: chip, copies: 6}
    die: {type: d6}
    card: {type: card, copies: 1}

toolboxes:
  - {id: general-tools, label: General tools, scope: shared, side: left}
  - {id: player-tools, label: My tools, scope: player, side: right}

areas:
  - {id: shared-tokens, extends: shared-supply, label: Tokens, toolbox: general-tools}
  - {id: shared-markers, extends: shared-supply, label: Markers, toolbox: general-tools}
  - {id: player-chips, extends: player-supply, label: Poker chips, toolbox: player-tools}
  - {id: player-dice, extends: player-supply, label: Dice, toolbox: player-tools, infinite: false}
  - {id: deck, extends: deck, label: Deck, layout: {shared: {left: 25, top: 58, width: 7, height: 15}}}
  - {id: table, extends: table, label: Table, layout: {shared: {left: 24, top: 27, width: 52, height: 50}}}
  - {id: discard, extends: discard, label: Discard, layout: {shared: {left: 68, top: 58, width: 7, height: 15}}}
  - id: hand
    extends: hand
    label: Hand
    layout: {owner: {left: 21, top: 9, width: 70, height: 88}, opponent: {left: 3, top: 56, width: 72, height: 41}}
  - id: tricks
    extends: tricks
    label: Tricks
    layout: {owner: {left: 92, top: 23, width: 7, height: 74}, opponent: {left: 77, top: 56, width: 20, height: 41}}
  - id: player-area
    extends: tableau
    label: Tableau
    layout: {owner: {left: 1, top: 9, width: 19, height: 88}, opponent: {left: 3, top: 3, width: 72, height: 50}}

pieces:
  - {id: red-token, extends: token, label: Red token, color: "#d94b4b", initial: {area: shared-tokens}}
  - {id: blue-marker, extends: square-token, label: Blue marker, color: "#4287d9", initial: {area: shared-markers}}
  - {id: poker-chip, extends: chip, label: Poker chip, color: "#e7c65b", value: 5, initial: {area: player-chips, forEachPlayer: true}}
  - {id: player-die, extends: die, label: Player die, color: "#f4f0dd", initial: {area: player-dice, forEachPlayer: true}}
  - {id: sun, extends: card, label: Sun card, copies: 18, front: assets/card-sun.svg, back: assets/card-back.svg, initial: {area: deck}}
  - {id: moon, extends: card, label: Moon card, copies: 17, front: assets/card-moon.svg, back: assets/card-back.svg, initial: {area: deck}}
  - {id: forest, extends: card, label: Forest card, copies: 17, front: assets/card-forest.svg, back: assets/card-back.svg, initial: {area: deck}}
  - {id: reference, extends: card, label: Player reference, front: assets/card-reference.svg, initial: {area: player-area, forEachPlayer: true, faceUp: true}}

setup:
  - shuffle: deck
  - deal: {from: deck, to: hand, count: 13}
