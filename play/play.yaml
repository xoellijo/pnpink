schema: 1
name: PnPInk Trick Table
description: A lightweight four-player trick-taking prototype.

players:
  count: 4
  panelMode: rotate

turns:
  mode: trick-assisted
  order: clockwise

board:
  aspectRatio: 1.7
  background: "#173f35"

toolboxes:
  - id: general-tools
    label: General tools
    scope: shared
    side: left
  - id: player-tools
    label: My tools
    scope: player
    side: right

areas:
  - id: shared-tokens
    label: Tokens
    kind: supply
    scope: shared
    visibility: public
    toolbox: general-tools
    infinite: true
    actions: [move-from, move-to]
    layout: {rows: 1, columns: 1}

  - id: shared-markers
    label: Markers
    kind: supply
    scope: shared
    visibility: public
    toolbox: general-tools
    infinite: true
    actions: [move-from, move-to]
    layout: {rows: 1, columns: 1}

  - id: player-chips
    label: Poker chips
    kind: supply
    scope: player
    visibility: public
    toolbox: player-tools
    infinite: true
    actions: [move-from, move-to]
    layout: {rows: 1, columns: 1}

  - id: player-dice
    label: Dice
    kind: supply
    scope: player
    visibility: public
    toolbox: player-tools
    actions: [move-from, move-to]
    layout: {rows: 1, columns: 1}

  - id: deck
    label: Deck
    kind: stack
    scope: shared
    visibility: hidden
    actions: [draw, shuffle]
    layout:
      shared: {left: 25, top: 58, width: 7, height: 15}
      rows: 1
      columns: 1

  - id: table
    label: Table
    kind: center
    scope: shared
    visibility: public
    actions: [move-from, move-to]
    maxDrop: 1
    layout:
      shared: {left: 24, top: 25, width: 52, height: 50}
      rows: 2
      columns: 5

  - id: discard
    label: Discard
    kind: stack
    scope: shared
    visibility: public
    actions: [move-from, move-to, discard-to]
    layout:
      shared: {left: 68, top: 58, width: 7, height: 15}
      rows: 1
      columns: 1

  - id: hand
    label: Hand
    kind: hand
    scope: player
    visibility: owner
    actions: [move-from, move-to]
    layout:
      owner: {left: 21, top: 14, width: 73, height: 83}
      opponent: {left: 3, top: 56, width: 72, height: 41}
      rows: 1
      columns: 13

  - id: tricks
    label: Tricks
    kind: stack
    scope: player
    visibility: public
    actions: [move-from, move-to]
    layout:
      owner: {left: 95, top: 14, width: 4, height: 83}
      opponent: {left: 77, top: 56, width: 20, height: 41}
      rows: 1
      columns: 1

  - id: player-area
    label: Tableau
    kind: free
    scope: player
    visibility: public
    canHide: toggle
    actions: [move-from, move-to]
    layout:
      owner: {left: 1, top: 14, width: 19, height: 83}
      opponent: {left: 3, top: 3, width: 72, height: 50}
      rows: 1
      columns: 1

pieces:
  - id: red-token
    label: Red token
    type: token
    shape: circle
    color: "#d94b4b"
    copies: 6
    initial: {area: shared-tokens}
  - id: blue-marker
    label: Blue marker
    type: token
    shape: square
    color: "#4287d9"
    copies: 6
    initial: {area: shared-markers}
  - id: poker-chip
    label: Poker chip
    type: chip
    color: "#e7c65b"
    value: 5
    copies: 6
    initial: {area: player-chips, forEachPlayer: true}
  - id: player-die
    label: Player die
    type: d6
    color: "#f4f0dd"
    initial: {area: player-dice, forEachPlayer: true}
  - id: sun
    label: Sun card
    copies: 18
    front: assets/card-sun.svg
    back: assets/card-back.svg
    initial: {area: deck}
  - id: moon
    label: Moon card
    copies: 17
    front: assets/card-moon.svg
    back: assets/card-back.svg
    initial: {area: deck}
  - id: forest
    label: Forest card
    copies: 17
    front: assets/card-forest.svg
    back: assets/card-back.svg
    initial: {area: deck}
  - id: reference
    label: Player reference
    front: assets/card-reference.svg
    initial: {area: player-area, forEachPlayer: true, faceUp: true}

setup:
  - shuffle: deck
  - deal:
      from: deck
      to: hand
      count: 13
